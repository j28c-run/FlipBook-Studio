<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flipbook Studio Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-container">
    <!-- Studio Header -->
    <header class="studio-header">
      <div class="brand-section">
        <div class="brand-logo">FS</div>
        <span class="brand-name">Flipbook Studio</span>
        <span class="brand-badge">PRO v2.5</span>
      </div>

      <div class="header-actions">
        <!-- Transition Option Dropdown (Opcional) -->
        <div class="option-group">
          <span class="option-label">Transición:</span>
          <select id="select-transition" class="select-input">
            <option value="instant">⚡ Corte Normal / Instantáneo</option>
            <option value="fade">✨ Fundido Suave (Fade)</option>
            <option value="liquid">🌊 Onda WebGL 3D (Líquida)</option>
          </select>
        </div>

        <button class="btn-sidebar-toggle" id="btn-toggle-sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span>Galería de Medios</span>
        </button>
      </div>
    </header>

    <!-- Main Body Area -->
    <div class="studio-body">
      <!-- Main Stage Viewport -->
      <main class="viewport-stage" id="viewport-stage">
        <div class="stage-canvas-area">
          <div id="canvas-container"></div>
          <video id="video-overlay" playsinline></video>

          <!-- Empty State Prompt -->
          <div class="empty-stage-card" id="empty-stage-prompt">
            <div class="empty-icon-wrapper">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </div>
            <h3>Empieza cargando tus archivos</h3>
            <p>Sube secuencias de imágenes o videos para reproducirlos como animación Flipbook con transiciones configurables.</p>
            <button class="btn-upload-primary" onclick="document.getElementById('file-input').click()">Cargar Imágenes / Videos</button>
          </div>
        </div>

        <!-- Studio Timeline & Controls Dock -->
        <div class="studio-dock" id="studio-dock" style="display: none;">
          <!-- Timeline Scrubber Bar -->
          <div class="timeline-bar-wrapper">
            <span class="time-code" id="time-code">00:01</span>
            <div class="timeline-track" id="timeline-track">
              <div class="timeline-progress" id="timeline-progress"></div>
            </div>
            <span class="time-code" id="frame-counter" style="text-align: right;">1 / 1</span>
          </div>

          <!-- Player Toolbar Row -->
          <div class="dock-toolbar">
            <!-- Navigation Buttons -->
            <div class="toolbar-group">
              <button class="btn-dock-icon" id="btn-step-prev" title="Fotograma Anterior (Flecha Izquierda)">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              
              <button class="btn-dock-icon btn-play-main" id="btn-play" title="Reproducir / Pausar (Espacio)">
                <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
              </button>
              
              <button class="btn-dock-icon" id="btn-stop" title="Detener">
                <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
              </button>
              
              <button class="btn-dock-icon" id="btn-step-next" title="Fotograma Siguiente (Flecha Derecha)">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>

            <!-- Speed Preset Pills -->
            <div class="toolbar-group">
              <span class="option-label">Velocidad:</span>
              <div class="speed-pills">
                <button class="speed-pill" data-fps="24">24 FPS</button>
                <button class="speed-pill active" data-fps="10">10 FPS</button>
                <button class="speed-pill" data-fps="5">5 FPS</button>
                <button class="speed-pill" data-fps="1">1 FPS</button>
              </div>
            </div>

            <!-- Loop & Fullscreen Tools -->
            <div class="toolbar-group">
              <button class="btn-dock-icon active" id="btn-loop" title="Repetir en Bucle">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
              </button>
              <button class="btn-dock-icon" id="btn-fullscreen" title="Pantalla Completa">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </main>

      <!-- Sidebar Gallery Drawer -->
      <aside class="studio-sidebar" id="studio-sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Medios Cargados</span>
          <button class="btn-text-action" id="btn-clear-playlist">Limpiar Todo</button>
        </div>

        <div class="sidebar-body">
          <!-- Dropzone -->
          <div class="sidebar-dropzone" id="sidebar-dropzone">
            <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <div class="dropzone-text">
              <strong>Arrastra archivos aquí</strong><br>
              o haz clic para examinar
            </div>
            <input type="file" id="file-input" multiple accept="image/*,video/*" style="display:none;" />
          </div>

          <!-- Items List -->
          <div class="media-items-list" id="media-items-list">
            <!-- Rendered by JS -->
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Required WebGL & GSAP Libraries -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.4/TweenMax.min.js'></script>
  <script src="./script.js"></script>
</body>
</html>
